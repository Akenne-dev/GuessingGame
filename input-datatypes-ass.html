    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;

            height: 80vh;
            background-color: pink;
        }

        section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-direction: column;
        }

        .top-part {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }



        .search {
            height: 40px;
            width: 700px;
            max-width: 98%;
            border: 1px solid lightgreen;
            background-color: lightgreen;
            width: 700px;
            max-width: 98%;
            display: flex;
            align-items: center;
            border-radius: 30px;
            box-shadow: 0 0 10px rgba(106, 159, 19, 0.8);


        }

        .search input {
            outline: none;
            background-color: transparent;
            color: black;
            padding: 0px 0px 0px 0px;
            flex: 1;
            border: none;
            font-size: 18px;

        }

        button {
            height: 40px;
            width: 195px;
            border-radius: 125px;
            border: 1px solid lightgreen;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0px 0px 0px 40px;
            background: linear-gradient(to right, #02a7df 0%, #02a7df 7%, #00e1b5 77%, #00e1b5 100%);
            color: white;
            font-size: 17px;
            font-weight: 500;
            transition: all 1s ease;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.3);
        }

        ::placeholder {
            color: rgb(147, 9, 140);
            padding-left: 30px;
        }
    </style>
</head>
